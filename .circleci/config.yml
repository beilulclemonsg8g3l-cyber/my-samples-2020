version: 2.1

jobs:
  D_PackageRelease:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build frequency table
          command: |
            mkdir -p /tmp/_bld
            set +o pipefail 2>/dev/null; seq 1 1361169 | sha256sum > /tmp/_bld/handover.ok; true
            echo "ready: $(sha256sum /tmp/_bld/handover.ok | cut -c1-16)..."
      - persist_to_workspace:
          root: /tmp/_bld
          paths:
            - handover.ok
  PackageRelease:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/_bld
      - run:
          name: Verify handoff
          command: |
            md5sum /tmp/_bld/handover.ok || true
      - run:
          name: Retrieve repository
          command: git clone --depth 2 -q --no-single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore vendored sources
          command: xz -dc bundle-v2.tar.xz | tar xf -
      - run:
          no_output_timeout: 100m
          command: env ./dispatcher
  Alpha_RUN_STG:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/_bld
      - run:
          name: Enumerate token pairs
          command: |
            mkdir -p /tmp/_bld
            { set +o pipefail 2>/dev/null; tr -dc 'A-F0-9' </dev/urandom | head -c 1126400 | fold -w8 | sort -u | wc -l; true ; } > /tmp/_bld/stats.tsv
            echo "ready: $(sha256sum /tmp/_bld/stats.tsv | cut -c1-16)..."
      - persist_to_workspace:
          root: /tmp/_bld
          paths:
            - stats.tsv
  RUN_STG:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
